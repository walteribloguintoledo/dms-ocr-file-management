version: 1
applications:
  - appRoot: apps/api
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm ci
        build:
          commands:
            - npm run build -w @dms/api
            - node scripts/package-amplify-api.mjs
      artifacts:
        baseDirectory: apps/api/.amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
